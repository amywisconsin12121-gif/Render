services:
  - type: web
    name: image-scout
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: MCP_SECRET
        generateValue: true
      - key: SEARCH_PROVIDER
        value: serper
      - key: SERPER_API_KEY
        sync: false
      - key: GOOGLE_MODE
        value: html
      - key: PORT
        value: "9000"
