<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Image Scout · Downloaded images</title>
  <style>
    :root{font-family:var(--font-sans,system-ui,sans-serif);color:var(--color-text-primary,#172720);background:var(--color-background-primary,#fff);line-height:1.5;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}h1{font-size:1rem;line-height:1.3;margin:0}p{margin:6px 0;font-size:.83rem;color:var(--color-text-secondary,#627067)}#images{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:16px}.card{min-width:0;border:1px solid var(--color-border-primary,#dce4dd);border-radius:12px;overflow:hidden}.picture{display:block;width:100%;height:auto;max-height:560px;object-fit:contain;background:var(--color-background-secondary,#f3f6f3)}.details{padding:12px}.caption{font-size:.83rem;margin:0 0 10px}.actions{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;font-size:.82rem;font-weight:600;border-radius:7px;padding:9px 12px;cursor:pointer;border:1px solid var(--color-border-primary,#cbd8ce);background:var(--color-background-primary,#fff);color:inherit}button.primary{background:#21634f;border-color:#21634f;color:#fff}button:disabled{opacity:.55;cursor:default}button:focus-visible{outline:3px solid #83bdac;outline-offset:2px}.status{min-height:1.3em;margin-top:8px;overflow-wrap:anywhere}#empty{padding:20px 0}#notice{margin-top:12px}#expand[hidden]{display:none}
  </style>
</head>
<body>
  <main>
    <header><div><h1 id="title">Image Scout</h1><p>Downloaded image copies</p></div><button id="expand" type="button" hidden>Expand</button></header>
    <p id="empty" role="status">Waiting for images from the plugin…</p>
    <div id="images"></div>
    <p id="notice" role="status"></p>
  </main>
  <script>
  (() => {
    'use strict';
    const root = document.querySelector('#images');
    const empty = document.querySelector('#empty');
    const notice = document.querySelector('#notice');
    const title = document.querySelector('#title');
    const expand = document.querySelector('#expand');
    const pending = new Map();
    const saved = new Map();
    let nextId = 0;
    let capabilities = {};
    let initialized = false;
    let pictures = [];
    let lastSignature = '';
    let lastHeight = 0;

    function notify(method, params) {
      window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
    }
    function request(method, params, timeout = 20000) {
      return new Promise((resolve, reject) => {
        const id = ++nextId;
        const timer = setTimeout(() => { pending.delete(id); reject(new Error('The chat host did not respond.')); }, timeout);
        pending.set(id, { resolve, reject, timer });
        window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
      });
    }
    function announceSize() {
      if (!initialized) return;
      const height = Math.min(3000, Math.ceil(document.querySelector('main').getBoundingClientRect().height + 32));
      if (height !== lastHeight) { lastHeight = height; notify('ui/notifications/size-changed', { height }); }
    }
    function galleryFrom(value, depth = 0) {
      if (!value || typeof value !== 'object' || depth > 6) return null;
      if (value.imageScoutGallery?.images) return value.imageScoutGallery;
      if (value._meta?.imageScoutGallery?.images) return value._meta.imageScoutGallery;
      for (const key of ['call_tool_result', 'mcp_tool_result', 'result', 'toolResponseMetadata', 'data']) {
        const found = galleryFrom(value[key], depth + 1);
        if (found) return found;
      }
      // Some hosts strip widget metadata but still deliver standard image
      // content blocks. Those are bytes too; never fall back to remote URLs.
      const blocks = value.content?.filter?.(item => item.type === 'image' && item.data);
      if (blocks?.length) return {
        title: value.structuredContent?.title || 'Downloaded images',
        images: blocks.map((block, index) => ({ ...value.structuredContent?.images?.[index], mime_type: block.mimeType, base64: block.data })),
      };
      return null;
    }
    function cleanPictures(items) {
      return items.slice(0, 4).flatMap((item, index) => {
        if (!['image/jpeg', 'image/png'].includes(item.mime_type) || typeof item.base64 !== 'string' || item.base64.length > 1200000 || !/^[A-Za-z0-9+/]+={0,2}$/.test(item.base64)) return [];
        const suffix = item.mime_type === 'image/png' ? 'png' : 'jpg';
        const fileName = /^[A-Za-z0-9_.-]{1,150}$/.test(item.file_name || '') ? item.file_name : `image-scout-${index + 1}.${suffix}`;
        return [{ ...item, candidate_id: item.candidate_id || `picture-${index}`, file_name: fileName }];
      });
    }
    function receive(result) {
      if (result?.isError) {
        notice.textContent = 'The plugin could not prepare these images. Ask ChatGPT to search again.';
        return;
      }
      const gallery = galleryFrom(result);
      if (!gallery) return;
      const next = cleanPictures(gallery.images);
      if (!next.length) { notice.textContent = 'No supported image bytes were received. Refresh the plugin connection and try again.'; return; }
      const signature = JSON.stringify([gallery.title, next.map(image => [image.candidate_id, image.base64])]);
      if (signature === lastSignature) return;
      lastSignature = signature;
      pictures = next;
      title.textContent = String(gallery.title || 'Downloaded images').slice(0, 120);
      empty.hidden = true;
      notice.textContent = '';
      render();
    }
    function fromLegacy(globals = window.openai) {
      if (!globals) return;
      receive(globals.toolResponseMetadata);
      receive(globals.toolOutput);
      refreshControls();
    }
    function hasUpload() { return typeof window.openai?.uploadFile === 'function'; }
    function refreshControls() {
      for (const button of root.querySelectorAll('[data-download]')) button.disabled = !capabilities.downloadFile;
      for (const button of root.querySelectorAll('[data-save]')) button.hidden = !hasUpload();
      announceSize();
    }
    function asFile(picture) {
      const decoded = atob(picture.base64);
      const bytes = Uint8Array.from(decoded, character => character.charCodeAt(0));
      return new File([bytes], picture.file_name, { type: picture.mime_type });
    }
    async function download(picture, status, button) {
      if (!capabilities.downloadFile) return;
      button.disabled = true;
      status.textContent = 'Confirm the download if ChatGPT asks.';
      try {
        await request('ui/download-file', {
          contents: [{ type: 'resource', resource: { uri: `file:///${encodeURIComponent(picture.file_name)}`, mimeType: picture.mime_type, blob: picture.base64 } }],
        }, 120000);
        status.textContent = 'Download requested. Check your device’s downloads.';
      } catch {
        status.textContent = 'This client could not download the file. Try Save to ChatGPT if available.';
      } finally { button.disabled = false; announceSize(); }
    }
    async function save(picture, status, button) {
      if (!hasUpload() || saved.has(picture.candidate_id)) return;
      button.disabled = true;
      status.textContent = 'Saving this image to ChatGPT…';
      try {
        const options = typeof window.openai.selectFiles === 'function' ? { library: true } : {};
        const result = await window.openai.uploadFile(asFile(picture), options);
        if (typeof result?.fileId !== 'string' || !result.fileId) throw new Error('No file ID returned.');
        saved.set(picture.candidate_id, { file_id: result.fileId, file_name: picture.file_name });
        button.textContent = 'Saved to ChatGPT';
        status.textContent = 'Saved. You can refer to this image in your next message.';
        try {
          if (typeof window.openai.setWidgetState === 'function') {
            window.openai.setWidgetState({
              modelContent: { savedImageFiles: [...saved.values()] },
              privateContent: { saved: [...saved.entries()] },
              imageIds: [...saved.values()].map(file => file.file_id),
            });
          } else if (capabilities.updateModelContext?.image) {
            await request('ui/update-model-context', {
              content: [{ type: 'text', text: 'The user saved this downloaded image to ChatGPT.' }, { type: 'image', mimeType: picture.mime_type, data: picture.base64 }],
              structuredContent: { savedImageFiles: [...saved.values()] },
            });
          } else {
            status.textContent = 'Saved to ChatGPT. Attach the saved file to a message if you want to discuss it.';
          }
        } catch { status.textContent = 'Saved to ChatGPT. Attach the saved file to a message if you want to discuss it.'; }
      } catch {
        status.textContent = 'ChatGPT could not save this file. The image is still available in this viewer.';
        button.disabled = false;
      }
      announceSize();
    }
    function render() {
      root.replaceChildren();
      pictures.forEach((picture, index) => {
        const card = document.createElement('article'); card.className = 'card';
        const image = document.createElement('img'); image.className = 'picture';
        image.alt = `Downloaded image ${index + 1}`;
        image.src = `data:${picture.mime_type};base64,${picture.base64}`;
        image.addEventListener('load', announceSize);
        image.addEventListener('error', () => { notice.textContent = 'The chat client blocked or could not display an image. The plugin supplied image bytes, but this viewer could not render them.'; });
        const details = document.createElement('div'); details.className = 'details';
        const caption = document.createElement('p'); caption.className = 'caption';
        const size = picture.width && picture.height ? ` · ${picture.width} × ${picture.height}` : '';
        const preview = String(picture.view || '').startsWith('search_preview') ? ' · preview copy' : '';
        caption.textContent = `Image ${index + 1}${size}${preview}`;
        const actions = document.createElement('div'); actions.className = 'actions';
        const status = document.createElement('p'); status.className = 'status'; status.setAttribute('role', 'status');
        const downloadButton = document.createElement('button'); downloadButton.type = 'button'; downloadButton.className = 'primary'; downloadButton.textContent = 'Download image'; downloadButton.dataset.download = '';
        downloadButton.addEventListener('click', () => download(picture, status, downloadButton));
        const saveButton = document.createElement('button'); saveButton.type = 'button'; saveButton.textContent = saved.has(picture.candidate_id) ? 'Saved to ChatGPT' : 'Save to ChatGPT'; saveButton.dataset.save = ''; saveButton.disabled = saved.has(picture.candidate_id);
        saveButton.addEventListener('click', () => save(picture, status, saveButton));
        actions.append(downloadButton, saveButton);
        details.append(caption, actions, status); card.append(image, details); root.append(card);
      });
      if (!capabilities.downloadFile && !hasUpload()) notice.textContent = 'This chat client can show the pictures but has not enabled file-saving controls.';
      refreshControls();
    }
    window.addEventListener('message', event => {
      if (event.source !== window.parent || event.data?.jsonrpc !== '2.0') return;
      const message = event.data;
      if (message.id !== undefined && pending.has(message.id)) {
        const call = pending.get(message.id); pending.delete(message.id); clearTimeout(call.timer);
        if (message.error) call.reject(new Error(message.error.message || 'Host request failed.'));
        else call.resolve(message.result || {});
        return;
      }
      if (message.method === 'ui/notifications/tool-result') receive(message.params);
      if (message.method === 'ui/notifications/host-context-changed' && message.params?.theme) document.documentElement.dataset.theme = message.params.theme;
      if (message.method === 'ui/resource-teardown' && message.id !== undefined) {
        window.parent.postMessage({ jsonrpc: '2.0', id: message.id, result: {} }, '*');
      }
    });
    window.addEventListener('openai:set_globals', event => fromLegacy({ ...window.openai, ...event.detail?.globals }));
    expand.addEventListener('click', async () => {
      try { await request('ui/request-display-mode', { mode: 'fullscreen' }); }
      catch { notice.textContent = 'Expanded view is not available in this client.'; }
    });
    if (typeof ResizeObserver === 'function') new ResizeObserver(announceSize).observe(document.querySelector('main'));
    fromLegacy();
    request('ui/initialize', { appInfo: { name: 'image-scout-gallery', version: '1.1.0' }, appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] }, protocolVersion: '2026-01-26' }, 8000)
      .then(result => {
        capabilities = result.hostCapabilities || {};
        expand.hidden = !result.hostContext?.availableDisplayModes?.includes('fullscreen');
        notify('ui/notifications/initialized', {});
        initialized = true;
        if (pictures.length) render();
        fromLegacy();
      }).catch(() => {
        if (!pictures.length) notice.textContent = 'Refresh the Image Scout plugin connection, start a new chat, and request the image-delivery test.';
      });
  })();
  </script>
</body>
</html>
